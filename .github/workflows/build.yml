name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download proot (static)
        run: |
          B=https://github.com/proot-me/proot/releases/download/v5.3.0
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          curl -fL -o app/src/main/jniLibs/arm64-v8a/libproot.so   $B/proot-v5.3.0-aarch64-static
          curl -fL -o app/src/main/jniLibs/armeabi-v7a/libproot.so $B/proot-v5.3.0-arm-static
          chmod +x app/src/main/jniLibs/*/libproot.so
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Shellora-APK
          path: app/build/outputs/apk/debug/app-debug.apk
